<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dictionary</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      width: 600px;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: black;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: left;
    }

    .word {
      font-size: 28px;
      font-weight: bold;
    }

    .pronunciation {
      color: gray;
      margin-bottom: 10px;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin-bottom: 8px;
    }

    .reference {
      color: #555;
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Random Kannada Word</h1>
  <button onclick="loadRandomEntry()">New Word</button>

  <div id="card" class="card">
    Loading...
  </div>
</div>

<script>

const N_CHUNKS = 200;   // change if needed

async function loadRandomEntry() {
  try {
    const chunkId = Math.floor(Math.random() * N_CHUNKS);

    const res = await fetch(`./dict_${chunkId}.json`);
    const data = await res.json();

    const entry = data[Math.floor(Math.random() * data.length)];

    renderCard(entry);

  } catch (err) {
    console.error(err);
    document.getElementById("card").innerHTML = "Error loading data";
  }
}

function renderCard(entry) {
  let html = "";

  html += `<div class="word">${entry.word}</div>`;

  if (entry.pronunciation) {
    html += `<div class="pronunciation">${entry.pronunciation}</div>`;
  }

  html += "<ul>";

  entry.definitions.forEach(d => {
    if (d.is_reference) {
      html += `<li class="reference">→ ${d.text}</li>`;
    } else {
      html += `<li>${d.text}</li>`;
    }
  });

  html += "</ul>";

  document.getElementById("card").innerHTML = html;
}

// load first word
loadRandomEntry();

</script>

</body>
</html>
