name = "Bauhaus"
license = "MIT"
licenselink = "https://github.com/AnilBattalahalli/chaos/blob/production/themes/Bauhaus/LICENSE"
description = "A Bauhaus-inspired Hugo theme: primary red/blue/yellow on warm paper, geometric circle-square-triangle motifs, flat colour blocks, lowercase geometric sans, strict grid, no shadows. Drop-in compatible with PaperMod's site config."
tags = ["bauhaus", "geometric", "modernist", "colourful", "blog", "portfolio", "dark mode", "search", "responsive"]
features = ["responsive", "blog", "cover-image", "table-of-contents", "opengraph", "favicon", "archive", "share-icons", "social-icons", "theme-toggle", "search", "palettes", "dark-mode"]
min_version = "0.146.0"

[author]
  name = "Anil Battalahalli"

# Template structure (layouts/partials/shortcodes/search) is derived from PaperMod by
# Aditya Telange & nanxiaobei (MIT). All visual design (CSS, header, footer, hero) is new.
[original]
  name = "PaperMod"
  author = "adityatelange"
  homepage = "https://github.com/adityatelange/hugo-PaperMod/"
  repo = "https://github.com/adityatelange/hugo-PaperMod/"
