name = "NeoBrutal"
license = "MIT"
licenselink = "https://github.com/AnilBattalahalli/chaos/blob/production/themes/NeoBrutal/LICENSE"
description = "A calm neobrutalist Hugo theme: 2px black borders, 5px radius, a crisp 4px hard shadow that collapses on hover, tinted page with white cards and one accent colour, DM Sans. Drop-in compatible with PaperMod's site config and restyles the site's applets to match."
tags = ["neobrutalism", "brutalist", "bold", "colourful", "blog", "portfolio", "dark mode", "search", "responsive"]
features = ["responsive", "blog", "cover-image", "table-of-contents", "opengraph", "favicon", "archive", "share-icons", "social-icons", "theme-toggle", "search", "palettes", "dark-mode"]
min_version = "0.146.0"

[author]
  name = "Anil Battalahalli"

# Template structure (layouts/partials/shortcodes/search) is derived from PaperMod by
# Aditya Telange & nanxiaobei (MIT). All visual design (CSS, header, footer, hero) is new.
[original]
  name = "PaperMod"
  author = "adityatelange"
  homepage = "https://github.com/adityatelange/hugo-PaperMod/"
  repo = "https://github.com/adityatelange/hugo-PaperMod/"
